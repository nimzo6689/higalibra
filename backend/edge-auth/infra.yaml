AWSTemplateFormatVersion: '2010-09-09'
Description: Execution role for the Higalibra CloudFront Lambda@Edge authorizer.

Resources:
  EdgeAuthExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
                - edgelambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'

Outputs:
  EdgeAuthExecutionRoleArn:
    Value: !GetAtt EdgeAuthExecutionRole.Arn
